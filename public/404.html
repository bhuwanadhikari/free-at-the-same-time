<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found – Free at the Same Time</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff7ee;
        --ink: #1c1433;
        --ink-2: #463e60;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #110c1f;
          --ink: #f6f2ff;
          --ink-2: #d2cae9;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font: 17px/1.6 ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 16px;
        max-width: 28em;
      }
      img {
        border-radius: 16px;
      }
      h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--ink-2);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 8px;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: 4px;
        background: #5b2eff;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a + a {
        background: transparent;
        color: var(--ink);
        box-shadow: inset 0 0 0 2px currentColor;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" width="64" height="64" alt="" />
      <h1>This page isn’t free right now</h1>
      <p>We couldn’t find that page. It may have moved, or the link may be wrong.</p>
      <nav>
        <a href="/">Go to the home page</a>
        <a href="/availability">Open the app</a>
      </nav>
    </main>
  </body>
</html>
